apiVersion: apps/v1
kind: Deployment

metadata:
  name: k8s-poc
  namespace: poc

spec:
  replicas: 2

  selector:
    matchLabels:
      app: k8s-poc

  template:
    metadata:
      labels:
        app: k8s-poc

    spec:
      containers:
        - name: app
          image: k8s-poc:1.0.0

          imagePullPolicy: Never

          ports:
            - containerPort: 8080

          env:
            - name: ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: k8s-poc-config
                  key: ENVIRONMENT

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "256Mi"

          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false

          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 20
